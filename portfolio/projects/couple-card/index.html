<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#fdeef1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>致最爱的你 · 3D 情侣电子贺卡</title>
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ma-shan-zheng@5/index.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/scene1.css" />
  <link rel="stylesheet" href="css/scene2.css" />
  <link rel="stylesheet" href="css/scene3.css" />
  <link rel="stylesheet" href="css/scene4.css" />

  <!-- GSAP（UMD，先于模块加载） -->
  <script src="https://unpkg.com/gsap@latest/dist/gsap.min.js"></script>
  <!-- 经典脚本：工具 / 存储 / 音乐 -->
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/music.js"></script>

  <!-- Three.js 模块映射 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@latest/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- 全局 3D 世界画布（WebGL，覆盖全页） -->
  <canvas id="world-canvas" aria-hidden="true"></canvas>
  <!-- CSS3D 文字层（由 CSS3DRenderer 接管） -->
  <div id="css3d-layer" aria-hidden="true"></div>

  <!-- 顶级加载失败提示（CDN 不可用时由 main.js 填充） -->
  <div id="load-fallback" hidden>
    <p>部分在线资源加载失败，请检查网络后刷新页面。</p>
  </div>

  <div id="app">

    <!-- ========== 场景一：封面（3D 信封）· HUD ========== -->
    <section class="scene active" id="scene1" data-index="0">
      <header class="cover-head">
        <h1 class="cover-title" data-animate>给最爱的你</h1>
        <p class="cover-sub" data-animate>有一封信，藏在春天里</p>
      </header>
      <p id="open-hint">点击信封 · 拆开这封信</p>
    </section>

    <!-- ========== 场景二：情书页（3D 信纸 + CSS3D 文字）· HUD ========== -->
    <section class="scene" id="scene2" data-index="1">
      <button class="icon-btn corner-btn" id="edit-love-btn" data-ripple aria-label="编辑情话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>

      <button class="chip-btn" id="fx-toggle" data-ripple aria-label="切换花瓣与星星">
        <svg id="fx-icon-flower" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="6.2" r="2.6"/><circle cx="17.6" cy="10.2" r="2.6"/><circle cx="15.5" cy="16.8" r="2.6"/><circle cx="8.5" cy="16.8" r="2.6"/><circle cx="6.4" cy="10.2" r="2.6"/><circle cx="12" cy="11.8" r="2.2" fill="#fff8f0"/></svg>
        <svg id="fx-icon-star" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M12 2.5l1.9 6.1 6.1 1.9-6.1 1.9L12 18.5l-1.9-6.1L4 10.5l6.1-1.9Z"/></svg>
        <span id="fx-toggle-label">星星</span>
      </button>

      <div class="music-cluster">
        <button class="icon-btn" id="music-upload-btn" data-ripple aria-label="上传背景音乐">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 20 19v-3"/></svg>
        </button>
        <button class="icon-btn music-main" id="music-btn" data-ripple aria-label="播放或暂停背景音乐">
          <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6.5" y="5" width="4" height="14" rx="1.4"/><rect x="13.5" y="5" width="4" height="14" rx="1.4"/></svg>
        </button>
      </div>
    </section>

    <!-- ========== 场景三：3D 回忆墙（弧形照片墙）· HUD ========== -->
    <section class="scene" id="scene3" data-index="2">
      <header class="scene-head">
        <h2 class="scene-title" data-animate>回忆时刻</h2>
        <p class="scene-sub" data-animate>拖动环绕观看 · 点击照片走近回忆</p>
      </header>

      <div class="wall-toolbar" data-animate>
        <button class="chip-btn accent" id="add-photos-btn" data-ripple>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10.5" r="1.8"/><path d="m5.5 17.5 4.2-4.2 3 3 3.2-3.2 2.6 2.6"/></svg>
          <span>添加照片</span>
        </button>
      </div>

      <!-- 聚焦单张照片时的 HUD -->
      <div id="focus-hud" hidden>
        <button class="icon-btn tiny" id="focus-prev" data-ripple aria-label="上一张">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 6-6 6 6 6"/></svg>
        </button>
        <span id="focus-counter">1 / 1</span>
        <button class="icon-btn tiny" id="focus-next" data-ripple aria-label="下一张">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 6 6 6-6 6"/></svg>
        </button>
        <button class="icon-btn tiny danger" id="focus-del" data-ripple aria-label="删除这张照片">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V5h5v2M6.5 7l1 12.5h9L17.5 7M10 11v5M14 11v5"/></svg>
        </button>
        <button class="icon-btn tiny" id="focus-close" data-ripple aria-label="返回照片墙">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <p id="empty-photos-hint" hidden>这里还没有照片，点上方「添加照片」上传你们的回忆</p>
    </section>

    <!-- ========== 场景四：3D 影院与祝福 · HUD ========== -->
    <section class="scene" id="scene4" data-index="3">
      <header class="scene-head">
        <h2 class="scene-title" data-animate>余生有你</h2>
        <p class="scene-sub" data-animate>放映我们的故事 · 写下我们的约定</p>
      </header>

      <div class="blessing-block" data-animate>
        <p class="blessing-text" id="blessing-text"></p>
        <button class="icon-btn tiny" id="edit-bless-btn" data-ripple aria-label="编辑祝福与结语">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
      </div>

      <div class="video-hud" data-animate>
        <button class="chip-btn accent" id="upload-video-btn" data-ripple>上传影片（50MB 以内）</button>
        <button class="chip-btn small" id="play-video-btn" data-ripple hidden>播放 / 暂停</button>
        <button class="chip-btn small" id="replace-video-btn" data-ripple hidden>更换影片</button>
        <button class="chip-btn small danger" id="remove-video-btn" data-ripple hidden>删除影片</button>
      </div>

      <p class="avatar-hint" data-animate>点击 3D 头像框可更换头像 · 金色心形线上有爱心流动</p>
    </section>

  </div>

  <!-- 底部导航 -->
  <nav id="nav-dots" aria-label="场景导航">
    <button class="dot active" data-go="0" data-ripple aria-label="封面"></button>
    <button class="dot" data-go="1" data-ripple aria-label="情书"></button>
    <button class="dot" data-go="2" data-ripple aria-label="回忆"></button>
    <button class="dot" data-go="3" data-ripple aria-label="祝福"></button>
  </nav>
  <button id="next-btn" data-ripple aria-label="下一页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  <!-- 情话编辑弹窗 -->
  <div class="modal" id="love-modal">
    <div class="modal-card">
      <h3>写下你的情话</h3>
      <textarea id="love-input" class="no-swipe" maxlength="500" placeholder="一笔一画，写给他/她的话……"></textarea>
      <div class="char-count"><span id="love-count">0</span>/500</div>
      <div class="modal-actions">
        <button class="chip-btn" data-close-modal data-ripple>取消</button>
        <button class="chip-btn accent" id="love-save" data-ripple>保存</button>
      </div>
    </div>
  </div>

  <!-- 祝福/结语编辑弹窗 -->
  <div class="modal" id="bless-modal">
    <div class="modal-card small">
      <h3>祝福与结语</h3>
      <label class="field-label" for="bless-input">祝福文字</label>
      <textarea id="bless-input" class="no-swipe" maxlength="300" placeholder="愿我们的故事……"></textarea>
      <label class="field-label" for="ending-input">结语（3D 金色大字）</label>
      <input id="ending-input" class="text-input no-swipe" maxlength="12" placeholder="永远在一起" />
      <div class="modal-actions">
        <button class="chip-btn" data-close-modal data-ripple>取消</button>
        <button class="chip-btn accent" id="bless-save" data-ripple>保存</button>
      </div>
    </div>
  </div>

  <!-- 通用确认弹窗 -->
  <div class="modal" id="confirm-modal">
    <div class="modal-card small">
      <p id="confirm-msg">确定吗？</p>
      <div class="modal-actions">
        <button class="chip-btn" id="confirm-cancel" data-ripple>取消</button>
        <button class="chip-btn danger" id="confirm-ok" data-ripple>确定</button>
      </div>
    </div>
  </div>

  <!-- 提示气泡 -->
  <div id="toast-wrap" aria-live="polite"></div>

  <!-- 隐藏文件选择器 -->
  <input type="file" id="input-photos" accept="image/*" multiple hidden />
  <input type="file" id="input-video" accept="video/*" hidden />
  <input type="file" id="input-music" accept="audio/*" hidden />
  <input type="file" id="input-avatar-1" accept="image/*" hidden />
  <input type="file" id="input-avatar-2" accept="image/*" hidden />

  <!-- 模块加载看门狗：importmap/CDN 失败时给出提示 -->
  <script>
    window.__cardBootOK = false;
    setTimeout(function () {
      if (!window.__cardBootOK) {
        var el = document.getElementById("load-fallback");
        if (el) el.hidden = false;
      }
    }, 9000);
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
